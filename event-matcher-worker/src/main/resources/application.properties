spring.application.name=settlement-service

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${EVENT_MATCHER_WORKER_KAFKA_GROUP_ID:event-matcher-worker}
spring.kafka.consumer.auto-offset-reset=earliest
# Both key and value deserializers are wrapped in ErrorHandlingDeserializer so a poison record
# (e.g. malformed JSON) raises a catchable DeserializationException instead of crashing poll().
# The DefaultErrorHandler bean (see KafkaConsumerConfig) then decides how many times to retry it.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.sporty.event.matcher.worker.adapter.in.messaging.EventOutcomeMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sporty.event.matcher.worker.adapter.in.messaging

rocketmq.name-server=${EVENT_MATCHER_WORKER_ROCKETMQ_NAME_SERVER:localhost:9876}
rocketmq.producer.group=${EVENT_MATCHER_WORKER_ROCKETMQ_PRODUCER_GROUP:event-matcher-worker-producer}

# In-memory H2 database: DB_CLOSE_DELAY=-1 keeps data alive for the app's lifetime
# (H2 normally drops an in-memory DB when the last connection closes).
spring.datasource.url=jdbc:h2:mem:event-matcher-worker;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Outbox dispatcher: one RocketMQ topic per outbox payload type.
event-matcher-worker.outbox.wallet-topics.BET_SETTLEMENT_WORK_UNIT=${EVENT_MATCHER_WORKER_OUTBOX_BET_SETTLEMENT_TOPIC:bet-settlements}

event-matcher-worker.batch.size=${EVENT_MATCHER_WORKER_BATCH_SIZE:100}
event-matcher-worker.outbox.dispatch.fixed-delay=${EVENT_MATCHER_WORKER_OUTBOX_DISPATCH_FIXED_DELAY:5000}
event-matcher-worker.messaging.event.outcome.topic=${EVENT_MATCHER_WORKER_EVENT_OUTCOME_TOPIC:event-outcomes}

# Spring Data JDBC has no schema-generation of its own; schema.sql runs on every startup.
spring.sql.init.mode=always

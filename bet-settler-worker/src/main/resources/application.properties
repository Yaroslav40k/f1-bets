spring.application.name=bet-settler-worker

rocketmq.name-server=${BET_SETTLER_WORKER_ROCKETMQ_NAME_SERVER:localhost:9876}
bet-settler-worker.rocketmq.topic=${BET_SETTLER_WORKER_ROCKETMQ_TOPIC:bet-settlements}
bet-settler-worker.rocketmq.consumer-group=${BET_SETTLER_WORKER_ROCKETMQ_CONSUMER_GROUP:bet-settler-worker}

# In-memory H2 database: DB_CLOSE_DELAY=-1 keeps data alive for the app's lifetime
# (H2 normally drops an in-memory DB when the last connection closes).
spring.datasource.url=jdbc:h2:mem:bet-settler-worker;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Data JDBC has no schema-generation of its own; schema.sql runs on every startup.
spring.sql.init.mode=always
